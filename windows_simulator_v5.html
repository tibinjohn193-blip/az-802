<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Server 2025 & Windows 11 Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base OS Aesthetics */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
        
        .bg-server { background: radial-gradient(circle at 70% 30%,#1d5fae,#08193a 75%); }
        .bg-client { background: radial-gradient(circle at 30% 30%,#b9d3ff,#3b6fd6 45%,#1a2466 95%); }
        
        /* Draggable Window Styling */
        .os-window {
            position: absolute; background: #f3f3f3; border: 1px solid #777; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; min-width: 300px; min-height: 200px;
            overflow: hidden; border-radius: 4px; z-index: 100;
        }
        .os-window.win11 { border-radius: 8px; border: 1px solid #c0c0c0; box-shadow: 0 8px 24px rgba(0,0,0,0.15); background: #ffffff; }
        
        .window-titlebar {
            background: #ffffff; border-bottom: 1px solid #ccc; padding: 6px 12px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: grab; user-select: none;
        }
        .window-titlebar:active { cursor: grabbing; }
        .window-title { font-size: 13px; font-weight: 600; color: #000; }
        .window-btn-close { width: 32px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; border: none; font-size: 14px;}
        .window-btn-close:hover { background: #e81123; color: white; }
        .window-btn-min { width: 32px; height: 24px; cursor: pointer; background: transparent; border: none; font-size: 14px; }
        .window-btn-min:hover { background: #ddd; }
        .tb-win { background: rgba(255,255,255,.12); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 4px; cursor: pointer; border-bottom: 2px solid #4cc2ff; max-width: 170px; white-space: nowrap; }
        .tb-win:hover { background: rgba(255,255,255,.25); }
        
        .window-content { flex: 1; overflow: auto; background: #ffffff; display: flex; flex-direction: column; font-size: 13px; color: #000; position: relative;}
        
        /* UI Elements */
        .os-input { border: 1px solid #888; padding: 4px 8px; font-size: 13px; width: 100%; outline: none; color: #000; }
        .os-input:focus { border-color: #0078d7; outline: 1px solid #0078d7; }
        .os-input:disabled { background-color: #e9e9ed; color: #666; cursor: not-allowed; }
        
        .os-btn { background: #e1e1e1; border: 1px solid #adadad; color: #000; padding: 4px 16px; cursor: pointer; font-size: 13px; min-width: 75px; transition: 0.1s; }
        .os-btn:hover:not(:disabled) { background: #e5f1fb; border-color: #0078d7; }
        .os-btn:disabled { background: #f0f0f0; border-color: #ccc; color: #999; cursor: not-allowed; }
        
        .list-item { padding: 4px 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .list-item:hover { background: #cce8ff; }
        .list-item.selected { background: #cce8ff; border: 1px dotted #99d1ff; }

        /* Taskbar & Start Menu */
        .taskbar { height: 48px; background: rgba(15,15,15,0.95); display: flex; align-items: center; padding: 0 10px; position: absolute; bottom: 0; width: 100%; z-index: 5000; backdrop-filter: blur(10px); border-top: 1px solid #333; gap: 8px;}
        .start-btn { width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; transition: 0.2s; border-radius: 4px; }
        .start-btn:hover { background: rgba(255,255,255,0.15); }
        
        .start-menu {
            position: absolute; bottom: 60px; left: 10px; width: 280px; background: #fafafa;
            border: 1px solid #999; box-shadow: 2px 2px 15px rgba(0,0,0,0.4); border-radius: 6px;
            display: none; flex-direction: column; z-index: 5001; padding: 8px 0;
        }
        .start-item { padding: 10px 20px; cursor: pointer; font-size: 14px; color: #111; display: flex; gap: 12px; align-items: center; transition: 0.1s; }
        .start-item:hover { background: #0078d7; color: white; }

        /* Context Menu & Dialogs */
        .context-menu {
            position: absolute; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            z-index: 9999; display: none; flex-direction: column; min-width: 150px; padding: 2px 0; font-size: 13px; color: #000;
        }
        .context-item { padding: 6px 16px; cursor: pointer; color: #000; }
        .context-item:hover { background: #e5f1fb; }
        
        .dialog-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.3); z-index: 9998; display: none; align-items: center; justify-content: center; }
        .dialog-box { background: white; border: 1px solid #999; box-shadow: 0 4px 15px rgba(0,0,0,0.4); min-width: 320px; display: flex; flex-direction: column; }

        /* Restart Screen */
        .restart-overlay {
            position: absolute; inset: 0; background: #0078d7; color: white;
            z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex h-screen w-full bg-gray-900 text-white overflow-hidden">

    <!-- Left Panel: Machine Selector -->
    <div class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col z-20 shadow-xl">
        <div class="p-5 font-bold text-sm uppercase tracking-widest text-gray-400 border-b border-gray-700">Virtual Lab</div>
        <div class="flex-1 p-3 space-y-3">
            <button id="btn-server" onclick="switchOS('server')" class="w-full text-left p-4 rounded-md bg-blue-600 hover:bg-blue-500 transition shadow-lg border border-blue-400">
                <div class="font-bold text-lg text-white">Server OS</div>
                <div class="text-xs text-blue-100 mt-1">Windows Server 2025</div>
            </button>
            <button id="btn-client" onclick="switchOS('client')" class="w-full text-left p-4 rounded-md bg-gray-700 hover:bg-gray-600 transition border border-gray-600">
                <div class="font-bold text-lg text-white">Client OS</div>
                <div class="text-xs text-gray-300 mt-1">Windows 11</div>
            </button>
        </div>
    </div>

    <!-- Center: Interactive Desktop -->
    <div class="flex-1 relative overflow-hidden bg-server" id="desktop">
        <div id="window-container" class="absolute inset-0 pointer-events-none"></div>

        <!-- System Message Box -->
        <div class="dialog-overlay" id="dialog-overlay" style="pointer-events: auto;">
            <div class="dialog-box rounded">
                <div class="bg-gray-100 border-b border-gray-300 px-4 py-2 font-bold text-gray-800 text-sm flex justify-between" id="dialog-title">System Alert</div>
                <div class="p-5 text-gray-800 text-sm" id="dialog-message"></div>
                <div class="p-3 bg-gray-50 border-t border-gray-300 flex justify-end gap-2" id="dialog-buttons">
                    <button class="os-btn" onclick="closeDialog()">OK</button>
                </div>
            </div>
        </div>

        <!-- Custom Context Menu -->
        <div id="ctx-menu" class="context-menu pointer-events-auto"></div>

        <!-- Restarting Overlay (Hidden by default) -->
        <div id="restart-screen" class="restart-overlay" style="display:none;">
            <div class="spinner"></div>
            <div class="text-2xl font-light">Restarting...</div>
        </div>

        <!-- Taskbar -->
        <div class="taskbar">
            <div class="start-btn" onclick="toggleStartMenu(event)">
                <svg viewBox="0 0 88 88" width="22" height="22"><path fill="currentColor" d="M0 12.402l35.687-4.86.016 34.423-35.67.203zm35.67 33.529l.016 34.453L0 76.105V45.714zm4.326-39.02L87.314 0v41.527l-47.318.376zm47.318 39.345L87.314 88l-47.318-6.938v-35.15z"/></svg>
            </div>
            <!-- File Explorer icon only for client -->
            <div class="start-btn text-2xl" id="tb-explorer" onclick="openApp('explorer')" style="display:none;" title="File Explorer">📁</div>

            <div id="tb-windows" class="flex gap-1 ml-2"></div>
            <div class="ml-auto mr-4 flex items-center text-sm font-semibold text-white" id="os-indicator">Windows Server 2025</div>
        </div>

        <!-- Start Menu -->
        <div class="start-menu pointer-events-auto" id="start-menu">
            <div class="px-4 py-2 font-bold text-gray-500 text-xs border-b border-gray-200 mb-2 uppercase" id="sm-title">Server Admin</div>
            
            <div class="start-item" onclick="openApp('run')">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#0078d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <polyline points="9 21 9 15 15 15 15 21"></polyline>
                </svg>
                <span class="ml-1 text-black">Run</span>
            </div>

            <div class="start-item" onclick="openApp('servermanager')" id="sm-smgr">⚙️ <span class="text-black ml-1">Server Manager</span></div>
            <div class="start-item" onclick="openApp('explorer')" id="sm-explorer" style="display:none;">📁 <span class="text-black ml-1">File Explorer</span></div>
        </div>
    </div>

    <!-- Right Panel: Tasks -->
    <div class="w-80 bg-white text-black border-l border-gray-300 flex flex-col z-20 shadow-[-4px_0_20px_rgba(0,0,0,0.15)]">
        <div class="p-5 bg-gray-100 border-b border-gray-300">
            <h2 class="font-bold text-lg text-blue-900">Exam Checklist</h2>
            <div class="text-sm font-semibold text-gray-600 mt-1">Completed: <span id="task-progress" class="text-blue-600">0/10</span></div>
        </div>
        <div class="flex-1 overflow-y-auto p-4 text-sm space-y-3" id="task-list"></div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            os: 'server',
            serverIp: '', serverDns: '', clientIp: '', clientDns: '',
            addsInstalled: false, domainPromoted: false, domainName: '',
            clientJoined: false,
            aduc: { techOU: false, user1: false, user2: false },
            gpo: { cp: false, cmd: false },
            roles: { iis: false, httpRedir: false, ftp: false },
            dns: { zone: false, aRecord: false },
            iis: { webSite: false, ftpSite: false },
            tasks: [
                { id: 1, text: "Set Server IP: 192.168.1.1, DNS: 192.168.1.1 via ncpa.cpl GUI", done: false },
                { id: 2, text: "Install AD DS Role (via Server Manager Wizard)", done: false },
                { id: 3, text: "Promote Server to DC (smec.com, DSRM: password123) & Restart", done: false },
                { id: 4, text: "Set Client IP: 192.168.1.2, DNS: 192.168.1.1 via ncpa.cpl GUI", done: false },
                { id: 5, text: "Join Client to 'smec.com' domain via File Explorer -> This PC", done: false },
                { id: 6, text: "ADUC: Create OU 'Tech', Users 'User1' & 'User2' (password123)", done: false },
                { id: 7, text: "GPMC: Create and link GPOs 'Block Control Panel' and 'Block Command Prompt', then right-click each > Edit and set its policy to Enabled", done: false },
                { id: 8, text: "Install IIS and HTTP Redirection Roles", done: false },
                { id: 9, text: "DNS: Create Zone 'tech.com', Host (A) 'www' -> 192.168.1.1", done: false },
                { id: 10, text: "IIS & Explorer: Create C:\\\\inetpub\\\\tech.com, add index.html, host TechWeb", done: false }
            ]
        };

        let activeAducNode = 'smec.com';
        const inetFolders = ['custerr','history','logs','temp','wwwroot'], inetNew = [];
        let expPath = 'c:\\\\inetpub', filesInTechCom = [];
        function pathNorm(p) { return p.trim().toLowerCase().replace(/\\\\+$/,''); }
        function renderSrvExplorer() {
            if (expPath === 'c:\\\\inetpub') {
                const all = [...inetFolders, ...inetNew];
                const itemsHtml = all.map(f => `<div class="text-center w-24 p-2 hover:bg-blue-50 rounded cursor-default" ondblclick="if('${f}'==='tech.com'){expPath='c:\\\\\\\\inetpub\\\\\\\\tech.com';renderSrvExplorer();}"><div class="text-4xl">📁</div><div class="text-xs">${f}</div></div>`).join('');
                
                openWindow('explorer', 'File Explorer - C:\\\\inetpub', `
                    <div class="flex flex-col h-full bg-white text-sm text-black" oncontextmenu="showCtxMenu(event, [{label:'New > Folder', action:showNewFolder}])">
                        <div class="bg-gray-100 border-b p-2 flex gap-2 items-center"><button class="os-btn" onclick="showNewFolder()">New folder</button><div class="flex-1 border bg-white px-2 py-1">This PC › Local Disk (C:) › inetpub</div></div>
                        <div class="p-4 flex flex-wrap gap-4 content-start flex-1">${itemsHtml}</div>
                    </div>`, 620, 380);
            } else if (expPath === 'c:\\\\inetpub\\\\tech.com') {
                const itemsHtml = filesInTechCom.map(f => `<div class="text-center w-24 p-2 hover:bg-blue-50 rounded cursor-default"><div class="text-4xl">📄</div><div class="text-xs">${f}</div></div>`).join('');
                openWindow('explorer', 'File Explorer - C:\\\\inetpub\\\\tech.com', `
                    <div class="flex flex-col h-full bg-white text-sm text-black" oncontextmenu="showCtxMenu(event, [{label:'New > Text Document', action:showNewFile}])">
                        <div class="bg-gray-100 border-b p-2 flex gap-2 items-center"><button class="os-btn" onclick="expPath='c:\\\\\\\\inetpub';renderSrvExplorer()">⬆ Up</button><div class="flex-1 border bg-white px-2 py-1">This PC › Local Disk (C:) › inetpub › tech.com</div></div>
                        <div class="p-4 flex flex-wrap gap-4 content-start flex-1">${itemsHtml.length ? itemsHtml : '<div class="text-gray-400 italic">This folder is empty. Right-click to add files.</div>'}</div>
                    </div>`, 620, 380);
            }
        }
        function showNewFolder() {
            showMsg('New folder', '<label class="text-black">Name:</label><input type="text" id="nf-name" class="os-input mt-1" value="tech.com">', [{text:'OK', action:() => {
                const n = document.getElementById('nf-name').value.trim();
                if(!n || [...inetFolders, ...inetNew].some(f => f.toLowerCase() === n.toLowerCase())) { showMsg('Error', 'Enter a unique folder name.'); return; }
                inetNew.push(n); renderSrvExplorer();
            }}, {text:'Cancel'}]);
        }
        function showNewFile() {
            showMsg('New Text Document', '<label class="text-black">File Name (including extension):</label><input type="text" id="nfile-name" class="os-input mt-1" value="index.html">', [{text:'OK', action:() => {
                const n = document.getElementById('nfile-name').value.trim();
                if(n) { filesInTechCom.push(n); renderSrvExplorer(); }
            }}, {text:'Cancel'}]);
        }

        // --- Core UI & Window Management ---
        let zIndexCounter = 100;
        
        function switchOS(os) {
            state.os = os;
            document.getElementById('desktop').className = `flex-1 relative overflow-hidden bg-${os}`;
            document.getElementById('os-indicator').innerText = os === 'server' ? 'Windows Server 2025' : 'Windows 11 Client';
            document.getElementById('sm-title').innerText = os === 'server' ? 'Server Admin' : 'Windows User';
            
            document.getElementById('btn-server').className = `w-full text-left p-4 rounded-md transition ${os==='server'?'bg-blue-600 text-white shadow-lg border border-blue-400':'bg-gray-700 text-gray-300 border border-gray-600 hover:bg-gray-600'}`;
            document.getElementById('btn-client').className = `w-full text-left p-4 rounded-md transition ${os==='client'?'bg-blue-600 text-white shadow-lg border border-blue-400':'bg-gray-700 text-gray-300 border border-gray-600 hover:bg-gray-600'}`;
            
            document.getElementById('sm-smgr').style.display = os === 'server' ? 'flex' : 'none';
            document.getElementById('sm-explorer').style.display = 'flex';
            document.getElementById('tb-explorer').style.display = 'flex';
            
            document.getElementById('window-container').innerHTML = ''; document.getElementById('tb-windows').innerHTML = ''; 
            closeStartMenu(); closeCtxMenu(); closeSmgrNotif();
        }

        function toggleStartMenu(e) { e.stopPropagation(); const sm = document.getElementById('start-menu'); sm.style.display = sm.style.display === 'flex' ? 'none' : 'flex'; closeSmgrNotif(); }
        function closeStartMenu() { document.getElementById('start-menu').style.display = 'none'; }
        
        document.addEventListener('click', () => { closeStartMenu(); closeCtxMenu(); closeSmgrNotif(); });

        function showMsg(title, msg, customButtons = null) {
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-message').innerHTML = msg;
            const btnContainer = document.getElementById('dialog-buttons');
            btnContainer.innerHTML = '';
            if (customButtons) {
                customButtons.forEach(b => {
                    const btn = document.createElement('button');
                    btn.className = 'os-btn';
                    btn.innerText = b.text;
                    btn.onclick = () => { closeDialog(); if(b.action) b.action(); };
                    btnContainer.appendChild(btn);
                });
            } else {
                btnContainer.innerHTML = `<button class="os-btn" onclick="closeDialog()">OK</button>`;
            }
            document.getElementById('dialog-overlay').style.display = 'flex';
        }
        function closeDialog() { document.getElementById('dialog-overlay').style.display = 'none'; }

        function simulateRestart(callback) {
            document.getElementById('restart-screen').style.display = 'flex';
            document.getElementById('window-container').innerHTML = ''; document.getElementById('tb-windows').innerHTML = '';
            closeDialog(); closeStartMenu(); closeCtxMenu();
            setTimeout(() => {
                document.getElementById('restart-screen').style.display = 'none';
                if(callback) callback();
            }, 3000);
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            let count = 0;
            state.tasks.forEach(t => {
                if(t.done) count++;
                list.innerHTML += `
                    <div class="flex items-start gap-3 p-3 rounded-md ${t.done ? 'bg-green-50 text-gray-400 line-through border border-green-100' : 'bg-white text-gray-800 border border-gray-200 shadow-sm'}">
                        <div class="mt-0.5 text-lg">${t.done ? '✅' : '◻️'}</div>
                        <div class="leading-snug">${t.text}</div>
                    </div>`;
            });
            document.getElementById('task-progress').innerText = `${count}/10`;
        }

        function completeTask(id) {
            const t = state.tasks.find(x => x.id === id);
            if (t && !t.done) { t.done = true; renderTasks(); showMsg('Task Complete', `Successfully completed:<br><br><b>${t.text}</b>`); }
        }

        // Window Engine
        function openWindow(id, title, contentHtml, width = 500, height = 400) {
            if(document.getElementById(`win-${id}`)) { updateWindowContent(id, contentHtml); focusWindow(`win-${id}`); return; }
            const win = document.createElement('div');
            win.id = `win-${id}`;
            win.className = `os-window pointer-events-auto ${state.os === 'client' ? 'win11' : ''}`;
            win.style.width = `${width}px`; win.style.height = `${height}px`;
            win.style.top = `${40 + (Math.random() * 40)}px`; win.style.left = `${100 + (Math.random() * 60)}px`;
            win.style.zIndex = ++zIndexCounter;

            win.innerHTML = `
                <div class="window-titlebar" onmousedown="startDrag(event, '${win.id}')">
                    <div class="window-title">${title}</div>
                    <div class="flex"><button class="window-btn-min" onclick="minWindow('${id}')">&#8211;</button><button class="window-btn-close" onclick="closeWindow('${id}')">✕</button></div>
                </div>
                <div class="window-content" id="content-${id}" onmousedown="focusWindow('${win.id}')">${contentHtml}</div>
            `;
            document.getElementById('window-container').appendChild(win);
            const tbb = document.createElement('div'); tbb.id = `tbw-${id}`; tbb.className = 'tb-win';
            tbb.textContent = title.length > 22 ? title.slice(0,22) + '…' : title; tbb.onclick = () => toggleWin(id);
            document.getElementById('tb-windows').appendChild(tbb);
        }
        function closeWindow(id) { const w = document.getElementById(`win-${id}`); if(w) w.remove(); const t = document.getElementById(`tbw-${id}`); if(t) t.remove(); }
        function minWindow(id) { const w = document.getElementById(`win-${id}`); if(w) w.style.display = 'none'; }
        function toggleWin(id) { const w = document.getElementById(`win-${id}`); if(!w) return; if(w.style.display === 'none' || w.style.zIndex != zIndexCounter) { w.style.display = 'flex'; focusWindow(w.id); } else w.style.display = 'none'; }
        function focusWindow(id) { const w = document.getElementById(id); if(w) { w.style.display = 'flex'; w.style.zIndex = ++zIndexCounter; closeCtxMenu(); closeSmgrNotif(); } }
        function updateWindowContent(id, newHtml) { const c = document.getElementById(`content-${id}`); if(c) c.innerHTML = newHtml; }

        let dragObj = null, offsetX, offsetY;
        function startDrag(e, id) {
            if(e.target.closest('button')) return;
            dragObj = document.getElementById(id); focusWindow(id);
            const rect = dragObj.getBoundingClientRect(); const dt = document.getElementById('desktop').getBoundingClientRect();
            offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top;
            document.addEventListener('mousemove', doDrag); document.addEventListener('mouseup', stopDrag);
        }
        function doDrag(e) {
            if(!dragObj) return; const dt = document.getElementById('desktop').getBoundingClientRect();
            dragObj.style.left = `${Math.max(0, e.clientX - dt.left - offsetX)}px`;
            dragObj.style.top = `${Math.max(0, e.clientY - dt.top - offsetY)}px`;
        }
        function stopDrag() { dragObj = null; document.removeEventListener('mousemove', doDrag); document.removeEventListener('mouseup', stopDrag); }

        // Context Menu Engine
        function showCtxMenu(e, items) {
            e.preventDefault(); e.stopPropagation(); closeSmgrNotif();
            const m = document.getElementById('ctx-menu');
            m.innerHTML = items.map((itm, idx) => `<div class="context-item" onclick="execCtx(${idx})">${itm.label}</div>`).join('');
            const dr = document.getElementById('desktop').getBoundingClientRect(); m.style.left = `${e.clientX - dr.left}px`; m.style.top = `${e.clientY - dr.top}px`; m.style.display = 'flex'; m.style.zIndex = ++zIndexCounter;
            window.currentCtxItems = items;
        }
        function execCtx(idx) { closeCtxMenu(); if(window.currentCtxItems[idx].action) window.currentCtxItems[idx].action(); }
        function closeCtxMenu() { document.getElementById('ctx-menu').style.display = 'none'; }

        // --- App Launcher ---
        function openApp(cmd) {
            closeStartMenu();
            if(cmd === 'run') { renderRun(); return; }
            if(cmd === 'explorer') { renderExplorer(); return; }
            
            switch(cmd.toLowerCase()) {
                case 'ncpa.cpl': renderNcpa(); break;
                case 'servermanager': if(state.os==='server') renderServerManager(); else showMsg('Error', 'App not found.'); break;
                case 'sysdm.cpl': renderSysdm(); break;
                case 'dsa.msc': if(state.os==='server') renderADUC(); else showMsg('Error', 'App not found.'); break;
                case 'gpmc.msc': if(state.os==='server') renderGPMC(); else showMsg('Error', 'App not found.'); break;
                case 'dnsmgmt.msc': if(state.os==='server') renderDNS(); else showMsg('Error', 'App not found.'); break;
                case 'inetmgr': if(state.os==='server') renderIIS(); else showMsg('Error', 'App not found.'); break;
                default: showMsg('Run', `Cannot find '${cmd}'. Make sure you typed the name correctly.`);
            }
        }
        
        function runCmd() { const v = document.getElementById('run-cmd').value.trim(); closeWindow('run'); openApp(v); }
        function renderRun() {
            openWindow('run', 'Run', `
                <div class="p-5 bg-[#f0f0f0] h-full flex flex-col">

                rwData.httpRedir = document.getElementById('rw-http').checked;
                rwData.ftp = document.getElementById('rw-ftp').checked;
            }

            if (dir === 1 && rwStep === 6) {
                finishRolesWizard();

                rwStep += dir; // Skip Step 5

            if(currentStepEl) currentStepEl.classList.remove('hidden');

            for(let i=1; i<=7; i++) {
                const nav = document.getElementById(`rw-nav-${i}`);
                if(nav) nav.className = (i === rwStep) ? 'text-blue-600' : 'text-gray-600 font-normal';
            }
            
            if (rwStep === 7) {
                document.getElementById('rw-btn-prev').style.display = 'none';
                document.getElementById('rw-btn-next').style.display = 'none';
                document.getElementById('rw-btn-cancel').style.display = 'none';
                document.getElementById('rw-btn-close').style.display = 'block';
            } else {
                document.getElementById('rw-btn-prev').style.display = 'inline-block';
                document.getElementById('rw-btn-next').style.display = 'inline-block';
                document.getElementById('rw-btn-cancel').style.display = 'inline-block';
                document.getElementById('rw-btn-close').style.display = 'none';
                
                document.getElementById('rw-btn-prev').disabled = (rwStep === 1);
                document.getElementById('rw-btn-next').innerText = (rwStep === 6) ? 'Install' : 'Next >';

                    state.dns.zone = true; renderDNS(); closeWindow('dns-wiz'); completeTask(9);
                } else {
                    showMsg('Validation Failed', 'Exam requires zone name to be "tech.com"');
                    window.dzStep = maxStep; document.getElementById('dz-step-' + window.dzStep).classList.remove('hidden');
                }
                return;
            }
            document.getElementById('dz-step-' + window.dzStep).classList.remove('hidden');
            document.getElementById('dz-prev').disabled = (window.dzStep === 1);
            document.getElementById('dz-next').innerText = (window.dzStep === maxStep) ? 'Finish' : 'Next >';
        }

        function showNewARecord() {
            showMsg('New Host', `
                <label class="text-black">Name (uses parent domain if blank):</label><input type="text" id="a-name" class="os-input mt-1 mb-2" placeholder="www">
                <label class="text-black">IP address:</label><input type="text" id="a-ip" class="os-input mt-1" placeholder="192.168.1.1">
            `, [{text: 'Add Host', action: () => {
                if(document.getElementById('a-name').value.trim() === 'www' && document.getElementById('a-ip').value.trim() === '192.168.1.1') {
                    state.dns.aRecord = true; renderDNS(); completeTask(9);
                } else showMsg('Validation Failed', 'Requires Name: www, and IP: 192.168.1.1');
            }}, {text: 'Done'}]);
        }

        function browseFolder() {
            window.tempWebName = document.getElementById('w-name') ? document.getElementById('w-name').value : '';
            window.tempWebHost = document.getElementById('w-host') ? document.getElementById('w-host').value : '';
            const currentPath = document.getElementById('w-path') ? document.getElementById('w-path').value : '';
            
            showMsg('Browse For Folder', `
                <div class="h-40 border overflow-auto bg-white p-2 text-sm text-black text-left">
                    <div class="font-bold">💻 This PC</div>
                    <div class="ml-4">💿 Local Disk (C:)</div>
                    <div class="ml-8 cursor-pointer hover:bg-blue-100 p-1" onclick="document.getElementById('b-sel').innerText='C:\\inetpub'">📁 inetpub</div>
                    ${inetNew.map(f => `<div class="ml-12 cursor-pointer hover:bg-blue-100 p-1" onclick="document.getElementById('b-sel').innerText='C:\\inetpub\\${f}'">📁 ${f}</div>`).join('')}
                </div>
                <div class="mt-2 text-sm text-black text-left">Folder: <span id="b-sel" class="font-bold"></span></div>
            `, [{text:'OK', action: () => {
                const sel = document.getElementById('b-sel').innerText;
                showNewWeb(sel || currentPath);
            }}, {text:'Cancel', action: () => {
                showNewWeb(currentPath);
            }}]);
        }
    
        // --- 10: IIS Manager ---

        function renderIIS() {
            if(!state.roles.iis) { showMsg('Error', 'IIS Role not installed. Use Server Manager to add roles.'); return; }
            
            let centerPane = '<div class="text-gray-400 italic p-2 text-xs flex-1">Select a site on the left to view features.</div>';
            if (state.iis.activeNode === 'TechWeb' && state.iis.webSite) {
                centerPane = `
                    <div class="flex-1 bg-white p-2">
                        <div class="font-bold border-b mb-2 pb-1 text-gray-700">TechWeb Home</div>
                        <div class="flex flex-wrap gap-4 mt-2">
                            <div class="text-center w-24 p-2 hover:bg-blue-50 rounded cursor-pointer border border-transparent hover:border-blue-200" ondblclick="renderDefaultDoc()">
                                <div class="text-4xl mb-1 text-blue-600">📄</div>
                                <div class="text-xs">Default Document</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            openWindow('iis', 'Internet Information Services (IIS) Manager', `
                <div class="flex h-full bg-white text-sm text-black">
                    <div class="w-1/3 border-r bg-[#fcfcfc] p-2 overflow-auto">
                        <div class="font-bold">💻 SERVER-2025</div>
                        <div class="ml-4 font-bold cursor-pointer hover:bg-gray-200" oncontextmenu="showCtxMenu(event, [{label:'Add Website...', action:showNewWeb}])">📂 Sites</div>
                        ${state.iis.webSite ? `<div class="ml-8 text-blue-700 list-item font-semibold cursor-pointer ${state.iis.activeNode === 'TechWeb' ? 'bg-blue-100' : ''}" onclick="state.iis.activeNode='TechWeb'; renderIIS();">🌐 ${state.iis.webName}</div>` : ''}
                    </div>
                    ${centerPane}
                </div>
            `, 700, 450);
        }
        
        function renderDefaultDoc() {
            openWindow('defdoc', 'Default Document - TechWeb', `
                <div class="flex h-full bg-white text-sm text-black">
                    <div class="flex-1 border-r p-2 overflow-auto" oncontextmenu="showCtxMenu(event, [{label:'Add...', action:showAddDefDoc}])">
                        <div class="font-bold mb-2 text-gray-700">Default Document</div>
                        <div class="bg-gray-100 border-b px-2 py-1 flex gap-2"><div class="font-bold flex-1">Name</div></div>
                        <div class="p-1 border-b">Default.htm</div>
                        <div class="p-1 border-b">Default.asp</div>
                        <div class="p-1 border-b">index.htm</div>
                        <div class="p-1 border-b">iisstart.htm</div>
                        ${state.iis.defaultDoc ? '<div class="p-1 font-bold text-blue-700 border-b">index.html</div>' : ''}
                        <div class="text-xs text-gray-400 mt-4 italic">Right-click to add a new default document.</div>
                    </div>
                    <div class="w-1/3 p-2 bg-gray-50">
                        <div class="font-bold border-b mb-2 pb-1 text-gray-700">Actions</div>
                        <div class="text-blue-600 cursor-pointer hover:underline list-item" onclick="showAddDefDoc()">➕ Add...</div>
                    </div>
                </div>
            `, 600, 400);
        }
        
        function showAddDefDoc() {
            showMsg('Add Default Document', `
                <label class="text-black block mb-1">Name:</label>
                <input type="text" id="defdoc-name" class="os-input" placeholder="e.g. index.html">
            `, [{text: 'OK', action: () => {
                const n = document.getElementById('defdoc-name').value.trim();
                if(n === 'index.html') {
                    if(!filesInTechCom.includes('index.html')) {
                        showMsg('Error', 'index.html does not exist in the physical folder C:\\\\inetpub\\\\tech.com!');
                        return;
                    }
                    state.iis.defaultDoc = true;
                    renderDefaultDoc();
                    checkIISDone();
                } else {
                    showMsg('Validation Failed', 'You must add index.html as the default document for this exam.');
                }
            }}, {text: 'Cancel'}]);
        }
        
        function checkIISDone() {
            if(state.iis.webSite && state.iis.defaultDoc) {
                completeTask(10);
            }
        }

        window.tempWebName = '';
        window.tempWebHost = '';
        
        function showNewWeb(overridePath = '') {
            showMsg('Add Website', `
                <label class="text-black block">Site name:</label><input type="text" id="w-name" class="os-input mt-1 mb-2" placeholder="TechWeb" value="${window.tempWebName}">
                <label class="text-black block">Physical path:</label>
                <div class="flex gap-1 mb-2">
                    <input type="text" id="w-path" class="os-input mt-1" placeholder="C:\\inetpub\\tech.com" value="${overridePath}">
                    <button class="os-btn mt-1 !min-w-0 px-3" onclick="browseFolder()">...</button>
                </div>
                <label class="text-black block">Host name:</label><input type="text" id="w-host" class="os-input mt-1 mb-2" placeholder="www.tech.com" value="${window.tempWebHost}">
                <div class="text-xs text-gray-500">Binding: http, port 80</div>
            `, [{text: 'OK', action: () => {
                const n = document.getElementById('w-name').value.trim();
                const p = document.getElementById('w-path').value.trim();
                const h = document.getElementById('w-host').value.trim();
                
                const showError = (msg) => {
                    window.tempWebName = n; window.tempWebHost = h;
                    showMsg('Validation Failed', msg, [{text: 'OK', action: () => showNewWeb(p)}]);
                };

                if(n !== 'TechWeb') { showError('Site name must be TechWeb.'); return; }
                if(p.toLowerCase() !== 'c:\\inetpub\\tech.com') { showError('Physical path must be C:\\inetpub\\tech.com.'); return; }
                if(!filesInTechCom.includes('index.html')) { showError('You must first create index.html in C:\\inetpub\\tech.com using File Explorer.'); return; }
                if(h !== 'www.tech.com') { showError('Host name must be www.tech.com.'); return; }
                
                state.iis.webSite = true; state.iis.webName = n; state.iis.activeNode = 'TechWeb'; window.tempWebName = ''; window.tempWebHost = ''; renderIIS();
            }}, {text: 'Cancel', action: () => { window.tempWebName = ''; window.tempWebHost = ''; } }]);
        }

        // --- Init ---
        window.onload = () => { renderTasks(); switchOS('server'); };
    </script>
</body>
</html>
